name: 'eks_setup'

on:
    workflow_dispatch:
        inputs:
            action:
                description: 'Action to perform'
                required: true
                default: 'create-cluster'
                type: choice
                options:
                    - create-cluster
                    - delete-cluster

permissions:
    contents: read
    id-token: write
    pull-requests: write
    security-events: write

env:
    BUCKET_TF_STATE : ${{ secrets.BUCKET_TF_STATE}} # The S3 bucket name for Terraform state storage
    AWS_IAM_ROLE : ${{secrets.AWS_IAM_ROLE}} # The IAM Role ARN to assume via OIDC for AWS access

jobs:
    security-scan:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        strategy:
            matrix:
                tool: [terrascan, checkov]
        name: Security Scanning (${{ matrix.tool }})
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Run Terrascan
              if: matrix.tool == 'terrascan'
              uses: tenable/terrascan-action@main
              with:
                iac_type: 'terraform'
                iac_version: 'v15'
                policy_type: 'aws'
                only_warn: true
                sarif_upload: true

            - name: Run Checkov
              if: matrix.tool == 'checkov'
              uses: bridgecrewio/checkov-action@master
              with:
                directory: .
                framework: terraform
                output_format: sarif
                output_file_path: checkov-report.sarif
                soft_fail: true

            - name: Upload Checkov SARIF report
              if: matrix.tool == 'checkov'
              uses: github/codeql-action/upload-sarif@v3
              with:
                sarif_file: checkov-report.sarif

    terraform:
        runs-on: ubuntu-latest
        timeout-minutes: 30
        needs: security-scan

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Cache Terraform
              uses: actions/cache@v3
              with:
                path: |
                  ~/.terraform.d/plugin-cache
                  .terraform
                key: terraform-${{ hashFiles('**/.terraform.lock.hcl') }}

            - name: Setup Terraform
              uses: hashicorp/setup-terraform@v3
              with:
                terraform_version: 1.9.8

            - name: Configure AWS Credentials via OIDC
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  role-to-assume: ${{env.AWS_IAM_ROLE}}
                  aws-region: us-east-1
                  role-session-name: GitHubActions
                  audience: sts.amazonaws.com        

            - name: Terraform Init
              run: terraform init -backend-config="bucket=$BUCKET_TF_STATE" 

            - name: Terraform Format
              run: terraform fmt -check

            - name: Terraform validate
              run: terraform validate

            - name: Terraform Plan
              if: github.event.inputs.action == 'create-cluster'
              run: terraform plan -input=false

            - name: Terraform Apply/Destroy
              run: |
                case "${{ github.event.inputs.action }}" in
                  "create-cluster")
                    terraform apply -auto-approve
                    ;;
                  "delete-cluster")
                    terraform destroy -auto-approve
                    ;;
                  *)
                    echo "Invalid action: ${{ github.event.inputs.action }}"
                    exit 1
                    ;;
                esac
